name: Perl lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perlcritic:
    name: Perl::Critic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Perl::Critic and the modules used by clog
        run: sudo apt-get update && sudo apt-get install -y libperl-critic-perl libswitch-perl libdbi-perl
      - name: Compile check
        run: |
          perl -T -c bin/clog
          for test in t/*.t; do perl -c "$test"; done
      # Settings are in .perlcriticrc
      - name: Perl::Critic
        run: perlcritic bin/clog t/
